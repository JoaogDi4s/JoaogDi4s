
name: Generate languages card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate languages.svg
        id: languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=pt-br&hide_title=false&layout=compact&card_width=320&langs_count=6&theme=dark&hide_border=false&custom_title=Linguagens
          path: dist/languages.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Display generation diagnostics
        if: always()
        run: |
          echo "Error type: ${{ steps.languages.outputs.error_type }}"
          echo "Error message: ${{ steps.languages.outputs.error_message }}"
          echo "Additional information: ${{ steps.languages.outputs.error_secondary_message }}"

      - name: Publish languages.svg
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
